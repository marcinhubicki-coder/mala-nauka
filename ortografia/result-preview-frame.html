<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#d9d5fa"><title>Mała Nauka — podgląd podsumowania</title><link rel="stylesheet" href="../app.css?v=47-result-retina"><style>.preview-systembar{position:absolute;z-index:10;inset:12px 29px auto 48px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;font:700 15px -apple-system,BlinkMacSystemFont,sans-serif;color:#151523}.preview-systembar svg{width:76px;height:18px}.preview-systembar[hidden]{display:none}</style></head><body><main id="app"></main><div class="preview-systembar" aria-hidden="true" hidden><span>08:11</span><svg viewBox="0 0 80 20"><path d="M2 16h3v-5H2Zm6 0h3V8H8Zm6 0h3V5h-3Zm6 0h3V2h-3Z" fill="currentColor"/><path d="M29 6q9-8 18 0m-15 3q6-5 12 0m-9 3q3-2 6 0" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/><circle cx="38" cy="16" r="1.5" fill="currentColor"/><rect x="53" y="2" width="23" height="15" rx="4" fill="currentColor"/><path d="M78 7v5" stroke="currentColor" stroke-width="2"/><text x="57" y="13" fill="white" font-size="10" font-weight="700">97</text></svg></div><script type="module">
import {renderSpellingResult,toggleResultDetail} from './result-screen.mjs?v=4-retina';
const root=document.querySelector('#app'),params=new URLSearchParams(location.search);
const source=[['_ma','ćma','ć','ć/ci'],['bu_a','burza','rz','rz/ż'],['kr_l','król','ó','u/ó'],['_aba','żaba','ż','rz/ż'],['r_ża','róża','ó','u/ó'],['_cho','ucho','u','u/ó'],['_leb','chleb','ch','ch/h']];
const scenario=params.get('case')||'mixed';
const base=source.map(([masked,word,answer,category],i)=>({kind:'spelling',masked,word,answer,category,correct:i>=4}));
const attempts=scenario==='empty'?[]:scenario==='correct'?base.map(x=>({...x,correct:true})):scenario==='review'?Array.from({length:14},(_,i)=>({...base[i%base.length],correct:false})):base;
if(params.has('safe')){root.style.setProperty('--result-safe-top','44px');root.style.setProperty('--result-safe-bottom','34px');document.querySelector('.preview-systembar').hidden=false;}
renderSpellingResult(root,{mode:'spelling',duration:180,dyktando:scenario==='dyktando',early:scenario!=='completed',attempts});
root.addEventListener('click',e=>{const button=e.target.closest('button[data-action]');if(!button)return;const action=button.dataset.action;if(action==='toggle-result')toggleResultDetail(root,button);else if(action==='again')location.href='./';else if(action==='home')location.href='../';else if(action==='history')location.href='../';});
</script></body></html>
