<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#dfddf8">
<title>Mała Nauka · Bubble Tuner</title>
<link rel="stylesheet" href="../spelling-art.css?v=tuner-1">
<link rel="stylesheet" href="./tuner.css?v=1">
</head>
<body>
<img class="spelling-screen-bg" src="../assets/ortografia/lake-background.webp" alt="">
<main id="app" class="bubble-tuner" data-view="game" data-mode="spelling">
  <header class="game-bar">
    <button type="button" class="icon tuner-close" aria-label="Wróć"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"/></svg></button>
    <div class="time-block"><span class="timer">0:52</span><progress max="100" value="78" aria-label="Podgląd paska czasu"></progress></div>
    <button type="button" class="icon tuner-pause" aria-label="Pauza animacji"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg></button>
  </header>
  <h1 class="spelling-title">Jak jest poprawnie?</h1>
  <div class="spelling-visual tuner-visual" role="button" tabindex="0" aria-label="Stuknij obrazek, aby pokazać kolejny asset"></div>
  <section class="spelling-question-card" aria-label="Podgląd słowa"><div class="question-content"></div></section>
  <section class="tuner-panel" aria-label="Parametry morpha">
    <div class="tuner-tabs" role="tablist" aria-label="Wybierz parametr">
      <button type="button" class="tuner-tab is-active" data-param="speed" aria-selected="true">S</button>
      <button type="button" class="tuner-tab" data-param="points" aria-selected="false">P</button>
      <button type="button" class="tuner-tab" data-param="random" aria-selected="false">R</button>
      <button type="button" class="tuner-tab" data-param="smoothing" aria-selected="false">W</button>
      <button type="button" class="tuner-tab" data-param="bounce" aria-selected="false">B</button>
      <button type="button" class="tuner-tab" data-param="corners" aria-selected="false">N</button>
    </div>
    <div class="tuner-slider-card">
      <label class="tuner-slider-label" for="tuner-range">Szybkość</label>
      <input id="tuner-range" type="range" min="2.2" max="6.6" step=".1" value="4.4">
      <output class="tuner-current" for="tuner-range">4.4</output>
    </div>
    <div class="tuner-values" aria-label="Aktualne ustawienia">
      <span data-readout="speed"><b>S</b><em>4.4</em></span>
      <span data-readout="points"><b>P</b><em>48</em></span>
      <span data-readout="random"><b>R</b><em>2.85×</em></span>
      <span data-readout="smoothing"><b>W</b><em>1.35×</em></span>
      <span data-readout="bounce"><b>B</b><em>0.75×</em></span>
      <span data-readout="corners"><b>N</b><em>2.00×</em></span>
    </div>
  </section>
</main>
<script type="module" src="./tuner.mjs?v=1"></script>
</body>
</html>
