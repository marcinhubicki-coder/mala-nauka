<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mała Nauka — Nowa przygoda</title><style>*{box-sizing:border-box}body{margin:0;display:flex;justify-content:center;align-items:flex-start;gap:28px;padding:18px;background:#ece9f7;color:#182452;font:15px system-ui,sans-serif}iframe{width:390px;height:844px;border:0;display:block;box-shadow:0 8px 40px #32244b24;flex-shrink:0}aside{width:240px;padding:12px 0}h1{font-size:20px;margin:0 0 16px}label{display:block;margin:18px 0 6px;font-size:13px}select,a{display:block;width:100%;padding:10px;border-radius:9px;border:1px solid #c9c3de;background:#fff;color:inherit;font:inherit}a{margin-top:20px;text-align:center;text-decoration:none}p{font-size:13px;line-height:1.5;color:#6d6687}@media(max-width:600px){body{padding:0;display:block}aside{width:auto;padding:10px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}aside h1,aside p,aside label{display:none}select{width:auto;flex:1}a{margin:0;padding:7px;width:auto}iframe{width:100%!important;height:calc(100dvh - 95px)!important;box-shadow:none}}</style></head><body><iframe id="phone" title="Mała Nauka w rozmiarze iPhone’a" src="ortografia/wizard-preview-frame.html?safe=1"></iframe><aside><h1>Nowa przygoda</h1><p>Ustawienia i gra korzystają z prawdziwych słów i logiki. Podglądy wyniku oraz postępów pokazują jawnie przykładowe dane.</p><label for="screen">Ekran</label><select id="screen"><option value="wizard">Ustawienia i gra</option><option value="mixed">Wynik · 2 / 7</option><option value="correct">Wynik · 7 / 7</option><option value="review">Wynik · 0 / 14</option><option value="progress">Moje postępy · dane przykładowe</option></select><label for="device">Telefon</label><select id="device"><option value="390,844">iPhone 13 Pro · 390 × 844</option><option value="393,852">iPhone 15 Pro · 393 × 852</option><option value="402,874">iPhone 16 Pro · 402 × 874</option><option value="430,932">iPhone Pro Max · 430 × 932</option><option value="390,700">Safari · 390 × 700</option></select><a id="open" href="ortografia/wizard-preview-frame.html">Pełny ekran</a><a href="index.html">Cała aplikacja</a></aside><script>const phone=document.querySelector('#phone'),screen=document.querySelector('#screen'),device=document.querySelector('#device'),open=document.querySelector('#open');function resize(){const[w,h]=device.value.split(',');phone.style.width=w+'px';phone.style.height=h+'px';}function change(){const path=screen.value==='wizard'?'ortografia/wizard-preview-frame.html':screen.value==='progress'?'progress-preview-frame.html':'ortografia/result-preview-frame.html?case='+screen.value+'&animate=1';phone.src=path+(path.includes('?')?'&':'?')+'safe=1';open.href=path;resize();}screen.addEventListener('change',change);device.addEventListener('change',resize);</script></body></html>
