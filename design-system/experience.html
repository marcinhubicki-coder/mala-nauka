<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><meta name="theme-color" content="#f5f5f7"><title>Mała Nauka · pilot odkryć</title><link rel="icon" href="../assets/icon-192.png"><link rel="stylesheet" href="../shared/components.css"><link rel="stylesheet" href="../shared/jelly-v4.css"><link rel="stylesheet" href="experience.css"></head>
<body><header class="experience-toolbar" id="experience-toolbar"><strong>Mała Nauka · pilot ekranów</strong><span class="experience-badge" id="experience-version">Ładowanie…</span><label>Przykład <select id="experience-fixture"><option value="six">6 samodzielnych odpowiedzi</option><option value="seven">7 samodzielnych odpowiedzi</option><option value="empty">Nowy gracz</option><option value="mixed">Pomyłki i podpowiedzi</option><option value="returns">Powroty po czasie</option></select></label><button id="experience-reset">Zacznij od nowa</button></header>
<main class="experience-wrapper"><div class="experience-phone"><div id="app" class="experience-screen" data-ds="1"></div><iframe id="experience-native-frame" title="Zamrożony widok z lokalnymi tekstami" hidden></iframe></div><aside class="experience-review" id="experience-review"><h2>Sprawdź przygodę</h2><p>To dane syntetyczne. Test nie zapisuje wyników dzieci.</p><label>Widok do recenzji<select id="experience-view"><option value="new">Nowe ekrany projektu</option></select></label><button id="experience-answer">Kolejna samodzielna odpowiedź</button><button id="experience-wrong">Przykładowa pomyłka</button><div class="experience-events" id="experience-events" role="status"></div><label>Uwaga do tego ekranu<textarea id="experience-comment" placeholder="Co warto zmienić?"></textarea></label><button id="experience-add-comment">Dodaj uwagę</button><div id="experience-comments"></div><button id="experience-copy-feedback">Skopiuj uwagi dla autora</button><textarea id="experience-feedback-output" aria-label="Pakiet uwag do skopiowania" hidden readonly></textarea><p class="experience-feedback" id="experience-feedback-status" role="status"></p></aside></main><script type="module" src="experience.mjs"></script></body></html>
