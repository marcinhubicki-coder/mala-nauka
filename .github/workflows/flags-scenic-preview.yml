name: Flags scenic Europe preview

on:
  push:
    branches: [feature/flags-scenic-preview-v1]
    paths:
      - '.github/workflows/flags-scenic-preview.yml'
      - 'tools/build-scenic-europe.mjs'
      - 'tools/flags-scenic-qa.mjs'
      - 'tools/flags-scenic-qa-parallel.mjs'
      - 'tools/flags-scenic-layout-qa.mjs'
      - 'flagi/scenic-preview.html'
      - 'flagi/scenic-preview.webmanifest'
      - 'flagi/scenic-preview.css'
      - 'flagi/scenic-*.mjs'
      - 'assets/flags/adventure/scenic-*'
      - 'assets/maps/europe-pigment-*'
      - 'assets/maps/europe-terrain-*'
      - 'assets/maps/europe-edge-*'
      - 'assets/maps/europe-atlas-v26.*'
      - 'assets/maps/europe-painted-v27.*'
      - 'assets/maps/europe-iberia-registration-v28.json'
      - 'assets/maps/atlas-*-v36.*'
      - 'tools/prepare-scenic-world.mjs'
      - 'assets/fonts/eb-garamond-*'
      - 'assets/fonts/charm-*'
      - 'assets/fonts/merienda-*'
      - 'tests/scenic-atlas-labels.test.mjs'
      - 'tools/assemble-scenic-atlas-hd.mjs'
      - 'adventure-preview.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flags-scenic-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  europe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript modules
        run: |
          node --check tools/build-scenic-europe.mjs
          node --check tools/flags-scenic-qa.mjs
          node --check tools/flags-scenic-qa-parallel.mjs
          node --check tools/flags-scenic-layout-qa.mjs
          node --check flagi/scenic-europe.mjs
          for file in flagi/scenic-*.mjs; do node --check "$file"; done
          node --test tests/scenic-atlas-labels.test.mjs
      - name: Install browser
        if: github.event_name == 'workflow_dispatch'
        run: |
          npm install --no-save --no-package-lock playwright@1.64.1
          npx playwright install --with-deps chromium webkit
      - name: Check registered atlas assets
        run: |
          test -s assets/maps/atlas-world-v36.data
          test -s assets/maps/atlas-ground-v36.webp
          test -s assets/maps/atlas-mountain-v36.webp
          node --input-type=module -e "import fs from 'node:fs'; import {gunzipSync} from 'node:zlib'; const a=JSON.parse(gunzipSync(fs.readFileSync('assets/maps/atlas-world-v36.data'))); if(a.features.length<200 || a.features.find(f=>f.id==='ru').neighbors.length!==14) throw Error('Incomplete world atlas');"
          test -s assets/maps/europe-painted-v27.webp
          test -s assets/maps/europe-atlas-v26.svg
          test -s assets/maps/europe-iberia-registration-v28.json
          test -s assets/fonts/eb-garamond-polish-v1.woff2
          test -s assets/fonts/charm-polish-v29.woff2
          test -s assets/flags/adventure/scenic-boy-v29.webp
          test -s assets/flags/adventure/scenic-task-sign-v28.webp
          node --input-type=module -e "import fs from 'node:fs'; const atlas=JSON.parse(fs.readFileSync('assets/maps/europe-atlas-v26.json')); if(atlas.features.filter(x=>x.capital).length<45) throw Error('Missing capital geography');"
      - name: Capture phone gameplay and verify SVG-only active border
        if: github.event_name == 'workflow_dispatch'
        id: qa
        continue-on-error: true
        run: |
          SCENIC_QA_PHASE=full node tools/flags-scenic-qa-parallel.mjs
          node tools/flags-scenic-layout-qa.mjs
      - name: Save generated atlas and screenshots on isolated branch
        if: always() && github.event_name == 'workflow_dispatch'
        run: |
          git add assets/maps/europe-scenic.webp
          if [ -d docs/flags-adventure/qa-scenic ]; then git add docs/flags-adventure/qa-scenic/; fi
          if [ -d docs/flags-adventure/qa-layout-v32 ]; then git add docs/flags-adventure/qa-layout-v32/; fi
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -m 'build(flags-scenic): update Europe map asset and phone screenshots'
            git pull --rebase origin feature/flags-scenic-preview-v1
            git push origin HEAD:feature/flags-scenic-preview-v1
          fi
      - name: Require visual QA success
        if: github.event_name == 'workflow_dispatch' && steps.qa.outcome == 'failure'
        run: exit 1
