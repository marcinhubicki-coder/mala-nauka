<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1170 2532" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfd2ff"/>
      <stop offset=".28" stop-color="#e5e2ff"/>
      <stop offset=".62" stop-color="#f6efff"/>
      <stop offset=".82" stop-color="#fff5ef"/>
      <stop offset="1" stop-color="#f4f0e9"/>
    </linearGradient>
    <radialGradient id="cloud" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff" stop-opacity=".94"/>
      <stop offset=".58" stop-color="#fff" stop-opacity=".58"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mount" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9d7f5"/><stop offset="1" stop-color="#e8e5f2"/></linearGradient>
    <linearGradient id="meadow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e7edda"/><stop offset="1" stop-color="#cfdcbe"/></linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8f6ff" stop-opacity=".92"/><stop offset="1" stop-color="#e8ecff" stop-opacity=".72"/></linearGradient>
    <filter id="blur60" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="blur28" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="blur12" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>

  <rect width="1170" height="2532" fill="url(#sky)"/>

  <!-- broad dreamy cloud masses -->
  <g opacity=".9" filter="url(#blur60)">
    <ellipse cx="75" cy="220" rx="330" ry="200" fill="url(#cloud)"/>
    <ellipse cx="1120" cy="390" rx="390" ry="235" fill="url(#cloud)"/>
    <ellipse cx="95" cy="1180" rx="300" ry="190" fill="url(#cloud)"/>
    <ellipse cx="1000" cy="1040" rx="340" ry="205" fill="url(#cloud)"/>
  </g>
  <g opacity=".56" filter="url(#blur28)">
    <ellipse cx="220" cy="520" rx="250" ry="105" fill="#fff"/>
    <ellipse cx="930" cy="680" rx="280" ry="120" fill="#fff"/>
    <ellipse cx="600" cy="1360" rx="330" ry="115" fill="#fff"/>
  </g>

  <!-- tiny warm sparkles -->
  <g fill="#fff4b7" opacity=".82" filter="url(#glow)">
    <circle cx="980" cy="160" r="11"/><circle cx="210" cy="690" r="9"/><circle cx="1020" cy="930" r="8"/><circle cx="170" cy="1320" r="8"/>
  </g>
  <g fill="#fff7cb" opacity=".9">
    <path d="M980 128 l8 20 20 8-20 8-8 20-8-20-20-8 20-8z"/>
    <path d="M205 660 l6 15 15 6-15 6-6 15-6-15-15-6 15-6z"/>
    <path d="M1020 900 l6 14 14 6-14 6-6 14-6-14-14-6 14-6z"/>
  </g>

  <!-- distant hills and lake, intentionally soft -->
  <path d="M0 1720 C165 1600 290 1640 430 1575 C590 1500 735 1590 870 1525 C980 1475 1085 1495 1170 1450 L1170 1970 L0 1970 Z" fill="url(#mount)" opacity=".72" filter="url(#blur28)"/>
  <path d="M0 1835 C170 1720 330 1780 500 1705 C680 1628 820 1715 1000 1640 C1070 1610 1125 1595 1170 1585 L1170 2080 L0 2080 Z" fill="#dfe2ef" opacity=".64"/>
  <rect y="1790" width="1170" height="365" fill="url(#lake)" opacity=".88"/>
  <path d="M0 1920 C250 1890 430 1950 620 1905 C815 1860 990 1900 1170 1840" fill="none" stroke="#fff" stroke-width="10" opacity=".28"/>

  <!-- faint fairytale castle -->
  <g transform="translate(790 1460)" fill="#b8b6df" opacity=".34" filter="url(#blur12)">
    <rect x="105" y="220" width="155" height="170" rx="14"/>
    <rect x="52" y="267" width="76" height="123" rx="10"/>
    <rect x="235" y="250" width="78" height="140" rx="10"/>
    <path d="M50 267 l40-85 40 85zM235 250 l39-102 39 102zM105 220 l77-145 78 145z"/>
    <rect x="176" y="35" width="12" height="58" rx="5"/><path d="M188 38 l55 15-55 19z"/>
  </g>

  <!-- foreground meadow -->
  <path d="M0 2135 C180 2050 350 2160 565 2075 C760 1998 945 2075 1170 1970 L1170 2532 L0 2532 Z" fill="url(#meadow)"/>
  <path d="M0 2260 C230 2165 390 2265 620 2188 C835 2117 1015 2185 1170 2100 L1170 2532 L0 2532 Z" fill="#d8e3c9" opacity=".92"/>
  <path d="M865 2160 C790 2238 735 2325 690 2450" fill="none" stroke="#fbefdc" stroke-width="34" stroke-linecap="round" opacity=".82"/>

  <!-- soft floral edge decoration -->
  <g opacity=".88">
    <g transform="translate(85 2240)"><circle cx="0" cy="0" r="23" fill="#f0b2d4"/><circle cx="28" cy="18" r="20" fill="#c9b1ee"/><circle cx="56" cy="-8" r="19" fill="#fff"/><circle cx="56" cy="-8" r="6" fill="#f0d46c"/></g>
    <g transform="translate(980 2220)"><circle cx="0" cy="0" r="19" fill="#fff"/><circle cx="0" cy="0" r="6" fill="#f0cf62"/><circle cx="42" cy="20" r="23" fill="#efb4d1"/><circle cx="82" cy="-7" r="20" fill="#c8afe9"/></g>
    <g transform="translate(170 2440)"><circle cx="0" cy="0" r="34" fill="#fff"/><circle cx="0" cy="0" r="8" fill="#f0cb58"/><circle cx="64" cy="20" r="36" fill="#efbdd6"/><circle cx="121" cy="-14" r="30" fill="#c7b2e9"/></g>
    <g transform="translate(890 2470)"><circle cx="0" cy="0" r="34" fill="#f3b5d1"/><circle cx="62" cy="-18" r="30" fill="#fff"/><circle cx="62" cy="-18" r="8" fill="#f0cf61"/><circle cx="118" cy="10" r="31" fill="#c7afe8"/></g>
  </g>
  <g opacity=".42" filter="url(#blur28)"><ellipse cx="130" cy="2500" rx="260" ry="100" fill="#b7cba5"/><ellipse cx="1040" cy="2480" rx="285" ry="110" fill="#bfd0ae"/></g>
</svg>