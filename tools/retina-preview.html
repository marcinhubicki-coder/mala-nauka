<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mała Nauka — podgląd iPhone / PWA</title>
<style>*{box-sizing:border-box}body{margin:0;padding:16px;background:#eef2f8;font:14px/1.45 system-ui;color:#263659}header{max-width:850px;margin:0 auto 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}button,select{min-height:38px;border:1px solid #d4deeb;border-radius:10px;padding:6px 12px;background:white;color:#263659;font:inherit}p{margin:5px 0;width:100%}.phone{width:max-content;max-width:none;margin:auto;padding:0;border-radius:18px;box-shadow:0 8px 40px #20365b18;overflow:hidden;background:#fff}iframe{display:block;width:390px;height:844px;border:0;background:white}#diagnostics{font-size:12px;color:#53647c}label{display:flex;align-items:center;gap:7px}</style>
</head><body>
<header><label>Ekran <select id="device"><option value="390,844,47,34">iPhone 13 Pro · 390 × 844 · @3x</option><option value="393,852,59,34">iPhone 14/15 Pro · 393 × 852 · @3x</option><option value="402,874,62,34">iPhone 16 Pro · 402 × 874 · @3x</option><option value="430,932,59,34">iPhone Pro Max · 430 × 932 · @3x</option><option value="375,667,20,0">Mały ekran · 375 × 667</option></select></label><label><input id="safe" type="checkbox" checked> Marginesy PWA</label><button id="demo">Dwa profile testowe</button><button id="many">Więcej profili testowych</button><button id="home">Ekran główny (gość)</button><button id="reload">Ekran wyboru</button><p id="diagnostics" role="status">Wczytuję podgląd…</p></header>
<div class="phone"><iframe id="screen" src="../" title="Podgląd Małej Nauki"></iframe></div>
<script type="module">
import {playerService} from '../player-service.mjs?v=6-backup';
const frame=document.querySelector('#screen'),device=document.querySelector('#device'),safe=document.querySelector('#safe'),status=document.querySelector('#diagnostics');
function applyDevice(){const [w,h,top,bottom]=device.value.split(',').map(Number);frame.style.width=w+'px';frame.style.height=h+'px';const doc=frame.contentDocument;if(doc){const insetTop=(safe.checked?top:0)+'px',insetBottom=(safe.checked?bottom:0)+'px';doc.documentElement.style.setProperty('--screen-safe-top',insetTop);doc.documentElement.style.setProperty('--screen-safe-bottom',insetBottom);const root=doc.querySelector('#app');root?.style.setProperty('--home-safe-top',insetTop);root?.style.setProperty('--home-safe-bottom',insetBottom);}report();}
function report(){const doc=frame.contentDocument,root=doc?.querySelector('#app');if(!root)return;const [w,h]=device.value.split(',');const bad=[...doc.images].filter(i=>i.complete&&i.naturalWidth===0);status.textContent=`${w} × ${h} CSS · ${root.dataset.view||'ładowanie'} · obszar ${root.clientHeight}px · zawartość ${root.scrollHeight}px · ${bad.length?'brakujące obrazy: '+bad.length:'obrazy OK'}`;}
frame.addEventListener('load',()=>{applyDevice();new MutationObserver(()=>requestAnimationFrame(report)).observe(frame.contentDocument.querySelector('#app'),{subtree:true,childList:true,attributes:true});});device.onchange=applyDevice;safe.onchange=applyDevice;document.querySelector('#reload').onclick=()=>frame.src='../';
async function seed(names){await playerService.init();const players=await playerService.listPlayers();for(let i=0;i<names.length;i++){if(!players.some(p=>p.nickname===names[i]))await playerService.createPlayer({nickname:names[i],pin:'0000',avatarId:['a','b','c','d'][i%4]});}frame.src='../';}
document.querySelector('#demo').onclick=()=>seed(['Maja','Olek']);document.querySelector('#many').onclick=()=>seed(['Maja','Olek','Wiktor','Aleksandra','BardzoDługiNickGracza']);setInterval(report,1500);
// Run the existing guest action through the app's button dispatcher. This
// exercises the same session and progress path as the real "Później" button.
document.querySelector('#home').onclick=()=>{const root=frame.contentDocument?.querySelector('#app');if(!root)return;const button=frame.contentDocument.createElement('button');button.type='button';button.dataset.action='guest-player';button.textContent='Później';root.append(button);button.click();button.remove();};
</script></body></html>
