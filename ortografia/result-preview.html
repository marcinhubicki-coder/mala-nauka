<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mała Nauka — Retina preview</title><style>*{box-sizing:border-box}body{margin:0;display:flex;justify-content:center;align-items:flex-start;gap:28px;padding:18px;background:#ece9f7;color:#182452;font:15px system-ui,sans-serif}iframe{width:390px;height:844px;border:0;display:block;box-shadow:0 8px 40px #32244b24;flex-shrink:0}aside{width:230px;padding:12px 0}h1{font-size:20px;margin:0 0 16px}label{display:block;margin:18px 0 6px;font-size:13px}select,a{display:block;width:100%;padding:10px;border-radius:9px;border:1px solid #c9c3de;background:#fff;color:inherit;font:inherit}a{margin-top:20px;text-align:center;text-decoration:none}p{font-size:13px;line-height:1.5;color:#6d6687}@media(max-width:600px){body{padding:0}aside{display:none}iframe{width:100%;height:100dvh;box-shadow:none}}</style></head><body><iframe id="phone" title="Podsumowanie rundy w rozmiarze iPhone’a" src="result-preview-frame.html?safe=1"></iframe><aside><h1>Podsumowanie rundy</h1><p>Podgląd korzysta z tego samego ekranu co rozgrywka. Przykładowe wyniki nie zapisują się w historii.</p><label for="device">Rozmiar ekranu</label><select id="device"><option value="390,844">iPhone 13 Pro · 390 × 844</option><option value="393,852">iPhone 15 Pro · 393 × 852</option><option value="402,874">iPhone 16 Pro · 402 × 874</option><option value="430,932">iPhone Pro Max · 430 × 932</option><option value="390,700">Safari · 390 × 700</option></select><label for="scenario">Przebieg rundy</label><select id="scenario"><option value="mixed">Przerwana · 3 / 7</option><option value="completed">Ukończona · 3 / 7</option><option value="correct">Wszystko poprawnie · 7 / 7</option><option value="review">Lista powtórek · 0 / 14</option><option value="dyktando">Dyktando · bez czasu</option><option value="empty">Bez odpowiedzi · 0 / 0</option></select><a id="open" href="result-preview-frame.html">Otwórz na telefonie</a></aside><script>const frame=document.querySelector('#phone'),device=document.querySelector('#device'),scenario=document.querySelector('#scenario'),open=document.querySelector('#open');function update(){const[w,h]=device.value.split(',');frame.style.width=w+'px';frame.style.height=h+'px';const url='result-preview-frame.html?case='+scenario.value;frame.src=url+'&safe=1';open.href=url;}device.addEventListener('change',update);scenario.addEventListener('change',update);</script></body></html>
