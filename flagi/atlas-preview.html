<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../"><title>Mała Nauka · Atlas kontynentów</title>
<style>@font-face{font-family:Atlas;src:url('assets/fonts/merienda-polish-v35.woff2')}*{box-sizing:border-box}body{margin:0;padding:24px;background:#f4e8c7;color:#513b24;font:16px system-ui}main{max-width:900px;margin:auto}h1{font:700 26px Atlas,cursive}nav{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}button{padding:10px 14px;border:1px solid #b2945d;background:#fff5db;color:#513b24;border-radius:18px;font:600 14px system-ui;cursor:pointer}button[aria-pressed=true]{background:#71502e;color:#fff5da}canvas{display:block;width:100%;height:auto;border-radius:18px}p{line-height:1.5}a{color:inherit}</style>
<main><h1>Atlas odkrywcy</h1><p>Wybierz kontynent, aby obejrzeć nowy podkład mapy.</p><nav aria-label="Kontynenty"><button data-region="europe" aria-pressed="true">Europa</button><button data-region="eurasia">Europa i Azja</button><button data-region="asia">Azja</button><button data-region="africa">Afryka</button><button data-region="northAmerica">Ameryka Północna</button><button data-region="southAmerica">Ameryka Południowa</button><button data-region="oceania">Oceania</button></nav><p id="status" role="status">Przygotowuję mapę…</p><canvas id="map" aria-label="Mapa kontynentu"></canvas><p><a href="flagi/scenic-preview.html?v=36&country=ua">Wróć do gry Flagi</a></p></main>
<script type="module">
import {loadWorldAtlas} from './flagi/scenic-world.mjs?v=36';
const canvas=document.querySelector('canvas'),status=document.querySelector('#status');let atlas,region='europe';
function draw(){if(!atlas)return;const bounds=atlas.continents[region];canvas.width=Math.min(1800,Math.round(canvas.clientWidth*Math.min(devicePixelRatio,2)));canvas.height=Math.round(canvas.width*bounds.h/bounds.w);atlas.paint(canvas.getContext('2d'),bounds,{w:canvas.width,h:canvas.height});status.textContent=document.querySelector(`[data-region="${region}"]`).textContent;}
document.querySelector('nav').addEventListener('click',event=>{const b=event.target.closest('button');if(!b)return;region=b.dataset.region;for(const button of document.querySelectorAll('button'))button.setAttribute('aria-pressed',String(button===b));draw();});
try{atlas=await loadWorldAtlas();draw()}catch{status.textContent='Nie udało się wczytać mapy. Odśwież stronę.'}new ResizeObserver(draw).observe(canvas);
</script></html>
