<!doctype html>
<html lang="pl">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
 <meta name="theme-color" content="#101c3c"><meta name="robots" content="noindex">
 <title>Mała Nauka · Design Studio</title>
 <link rel="icon" href="../assets/icon-192.png"><link rel="stylesheet" href="studio.css"><link rel="stylesheet" href="studio-preview.css"><link rel="stylesheet" href="studio-content.css"><link rel="stylesheet" href="studio-motion.css">
 <link rel="stylesheet" href="../shared/jelly-v4.css"><link rel="stylesheet" href="../shared/components.css">
 <link rel="stylesheet" href="studio-mobile.css">
</head>
<body>
 <div class="studio-shell">
  <aside class="sidebar">
   <a class="studio-brand" href="./"><img src="../assets/icon-192.png" alt=""><span>Mała Nauka<small>design studio</small></span></a>
   <div class="branch-tag"><span></span>design/system-v1</div>
   <nav aria-label="Design system" id="navigation"></nav>
   <div class="sidebar-bottom"><p>Wzorzec</p><strong>Ortografia + jelly</strong><small>Cień całego kontrolera: angielski</small><div class="device-label">iPhone 13 Pro · 3× Retina</div><a href="https://github.com/marcinhubicki-coder/mala-nauka/tree/design/system-v1" target="_blank" rel="noopener">Otwórz branch na GitHub ↗</a></div>
  </aside>
  <div class="studio-main">
   <header class="studio-topbar"><div class="topbar-title"><button class="quiet-button mobile-only" id="mobile-menu-open" aria-label="Otwórz sekcje studia" aria-haspopup="dialog">☰</button><div><span class="breadcrumb">Design system</span><h1 id="page-title">Komponenty</h1></div></div><div class="top-actions"><button class="quiet-button" id="studio-help" aria-label="Jak korzystać ze studia?" title="Jak korzystać ze studia?">?</button><button class="quiet-button" id="undo-toolbar" title="Cofnij ostatnią zmianę" aria-label="Cofnij ostatnią zmianę" disabled>↶ Cofnij</button><button class="quiet-button" id="redo-toolbar" title="Ponów zmianę" aria-label="Ponów zmianę" disabled>↷</button><span id="draft-status" role="status">Zapisana wersja</span><button class="quiet-button" id="connect-git">Połącz GitHub</button><button class="solid-button" id="save-git"><span class="desktop-save-label">Zapisz na GitHub</span><span class="mobile-only">Zapisz</span> <span id="change-count"></span></button></div></header>
   <main id="workspace" class="workspace"></main>
  </div>
 </div>
 <div id="toast" role="status" aria-live="polite"></div>
 <dialog id="studio-modal"></dialog>
 <dialog id="mobile-navigation" aria-label="Sekcje studia"><div class="mobile-menu-heading"><h2>Sekcje studia</h2><button class="quiet-button" id="mobile-menu-close" aria-label="Zamknij sekcje">×</button></div><nav id="mobile-navigation-list" aria-label="Sekcje"></nav><button class="quiet-button" id="mobile-connect-git">Połącz GitHub</button><p>Zmiany wyglądu, zasad i grafik korzystają z tego samego szkicu.</p></dialog>
 <nav class="mobile-editor-dock mobile-only" id="mobile-editor-dock" aria-label="Praca z ekranem" hidden><p id="mobile-editor-context"></p><div><button data-mobile-pane="choose" aria-pressed="true">Wybór</button><button data-mobile-pane="preview" aria-pressed="false">Podgląd</button><button data-mobile-pane="edit" aria-pressed="false">Ustawienia</button></div></nav>
 <script type="module" src="studio.mjs"></script>
 <script type="module" src="studio-mobile.mjs"></script>
</body>
</html>
