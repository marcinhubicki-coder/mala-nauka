<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7">
  <title>Asset loader</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="shell">
    <header><div><h1>Asset loader</h1><p>Ortografia · ręczne uzupełnianie grafik</p></div><span class="branch">manual-asset-loader</span></header>
    <section class="summary" aria-label="Podsumowanie">
      <div><strong id="missingCount">—</strong><span>brakujące</span></div>
      <div><strong id="stagedCount">—</strong><span>w kolejce</span></div>
      <div><strong id="assignedCount">—</strong><span>ma asset</span></div>
    </section>
    <nav class="tabs" aria-label="Widok listy"><button id="missingTab" class="active" type="button">Brakujące</button><button id="assignedTab" type="button">Ma asset</button></nav>
    <p id="status" class="status" role="status">Wczytywanie…</p>
    <section id="list" class="list"></section>
  </main>
  <footer><div class="footer-inner"><button id="commitButton" type="button" disabled>Zapisz paczkę do repo</button><small>Jeden commit dla wszystkich grafik z kolejki.</small></div></footer>
  <input id="fileInput" type="file" accept="image/*" hidden>
  <script type="module" src="./app.js"></script>
</body>
</html>
