name: Validate spelling images
on:
  push:
    paths: ['assets/scenes/**', 'spelling/scenes.mjs', 'scripts/validate_spelling_assets.py', '.github/workflows/spelling-assets.yml']
  pull_request:
    paths: ['assets/scenes/**', 'spelling/scenes.mjs', 'scripts/validate_spelling_assets.py', '.github/workflows/spelling-assets.yml']
permissions:
  contents: read
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=11.3,<13'
      - run: python scripts/validate_spelling_assets.py
